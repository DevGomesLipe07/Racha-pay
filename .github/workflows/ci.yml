name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - name: db-init (papéis sem superuser + bancos)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db-init.sql
      - run: npm run test:integration
      - name: E2E (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: cliente PostgreSQL 16 (mesma imagem do servidor, via Docker)
        run: |
          mkdir -p /tmp/pg16bin
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm --network host -v /tmp:/tmp -e PGPASSWORD postgres:16 %s "$@"\n' "$tool" > "/tmp/pg16bin/$tool"
            chmod +x "/tmp/pg16bin/$tool"
          done
          /tmp/pg16bin/pg_dump --version
      - name: backup + restore verificado (D22)
        env:
          BACKUP_DATABASE_URL: postgresql://rachapay_backup:rachapay_backup_dev@localhost:5432/rachapay_test
          RESTORE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # pg_dump mais novo que o servidor grava parâmetros que o 16 não conhece (ex.: transaction_timeout).
          PG_BIN: /tmp/pg16bin
        run: |
          npm run backup -- --out /tmp/rachapay.dump
          npm run backup:verify -- --dump /tmp/rachapay.dump

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build da imagem
        run: docker build -t rachapay:ci .
      - name: subir com compose e checar /ready
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/ready && exit 0; sleep 2; done
          docker compose logs app
          exit 1
